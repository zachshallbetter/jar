# The eval windows (#1518): the one list. No gate, deploy, restart or A/B write may start inside one, or LEAD_MIN
# minutes before one. Read by gate_queue.sh (and its `window` verb, which deploy.sh and ab_run.sh ask), and by
# chat_links_cycle.py. test_eval_windows.py fails if a window's times reappear as literals elsewhere.
# start end name [zone]   UTC unless a zone is named; a zoned line is converted to UTC for the day asked about (#1566),
# so it follows the clock change. The model eval's timer runs on Pacific time, so its line is Pacific. The household
# eval's timer is UTC-pinned, so the nightly stays UTC. Read by scripts/eval_windows.py.
0325 0350 nightly
0135 0300 model-eval America/Los_Angeles
# A gate takes about 5.5 min at GATE_JOBS=4 and a deploy about 10, so a start this close to a window ends before it.
LEAD_MIN 12
