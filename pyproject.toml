[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jar-node"
version = "0.1.0"
description = "Jar: Sovereign Household AI Appliance Node"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Zach Shallbetter" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "cryptography>=42.0.0",
]

[project.scripts]
jar = "jar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
