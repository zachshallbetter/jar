name: Feature request
description: Propose a new capability, device integration or option.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >
        Describe the household scenario you want Jar to handle and any privacy implications.
  - type: textarea
    id: problem
    attributes:
      label: The behavior you want
      description: What should Jar do? What is the use case?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you imagine it
      description: A command, an option, an API, or a change to the docs.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
